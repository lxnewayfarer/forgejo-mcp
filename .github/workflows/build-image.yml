name: Build & publish image

# Builds the forgejo-mcp Docker image and publishes it to GitHub Container
# Registry (ghcr.io/<owner>/forgejo-mcp). A deploy repo can then roll a
# published tag into k8s, as for gitlab-mcp.
#
# Triggers:
#   - push to main          -> tags: latest, sha-<short>
#   - push of a tag v*.*.*  -> tags: <semver>, latest
#
# The GHCR package is created private on first publish; make it public in the
# package settings on GitHub so the cluster can pull without an imagePullSecret.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/forgejo-mcp

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Prisma client is generated during build/test; generate it up front so
      # typecheck against the client's types succeeds.
      - run: npm run db:generate

      - run: npm run typecheck

      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
